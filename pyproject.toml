[project]
name = "yuxiaoer"
version = "0.3.1"
description = "鱼小二 · 闲鱼托管客服 Agent（R1 功能版）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "httpx>=0.28.1",
    "aiosqlite>=0.22.1",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "qrcode>=8.0",
    "pillow>=10.0",
    "msgpack>=1.0",
    "websockets>=17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yuxiaoer"]
