<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鱼小二 · 多账号控制台</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--text:#1f2328;--muted:#667085;--line:#e4e7ec;--ok:#12b76a;--warn:#f79009;--bad:#f04438;--brand:#175cd3}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  header{background:#101828;color:#fff;padding:18px 28px;display:flex;align-items:center;gap:16px}
  header h1{font-size:18px;margin:0;font-weight:600} header .who{margin-left:auto;color:#cbd5e1;font-size:13px}
  main{max-width:1280px;margin:24px auto;padding:0 20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .kpi{font-size:28px;font-weight:700}.muted{color:var(--muted)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#f9fafb;color:var(--muted);font-weight:600;font-size:12px}
  tr:last-child td{border-bottom:0}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
  .ok{background:var(--ok)}.bad{background:var(--bad)}.warn{background:var(--warn)}
  button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
  button:hover{border-color:#98a2b3}button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.danger{color:var(--bad)}input,select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;background:#fff}
  h2{font-size:15px;margin:22px 0 10px}.alert{padding:9px 10px;border-bottom:1px solid var(--line)}.alert:last-child{border-bottom:0}
  .pill{font-size:11px;padding:2px 7px;border-radius:99px;background:#eef2f6;color:#475467}
  .err{color:var(--bad);font-size:13px}.hide{display:none}
  .workbench{display:grid;grid-template-columns:360px 1fr;gap:14px}
  .conv{padding:10px;border-bottom:1px solid var(--line);cursor:pointer}.conv:hover{background:#f9fafb}
  .conv.active{background:#eef4ff;border-left:3px solid var(--brand)}
  .conv .name{font-weight:600}.conv .last{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thread{height:420px;overflow:auto;background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:10px}
  .msg{max-width:78%;margin:6px 0;padding:8px 10px;border-radius:10px;background:#fff;border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
  .msg.out{margin-left:auto;background:#e8f1ff;border-color:#c7ddff}.msg .meta{font-size:10px;color:var(--muted);margin-bottom:3px}
  textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;resize:vertical}
  #qr-mask{position:fixed;inset:0;background:rgba(16,24,40,.55);display:flex;align-items:center;justify-content:center;z-index:20}
  #qr-box{background:#fff;border-radius:14px;padding:20px;width:320px;text-align:center}
  #qr-box img{width:260px;height:260px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#fff}
</style>
</head>
<body>
<header>
  <h1>鱼小二 · 多账号控制台</h1>
  <span class="who" id="who">本机使用</span>
</header>
<main>
  <div class="grid">
    <div class="card"><div class="muted">闲鱼账号</div><div class="kpi" id="kpi-accounts">-</div></div>
    <div class="card"><div class="muted">运行中</div><div class="kpi" id="kpi-online">-</div></div>
    <div class="card"><div class="muted">已登录</div><div class="kpi" id="kpi-login">-</div></div>
    <div class="card"><div class="muted">未处理告警</div><div class="kpi" id="kpi-alerts">-</div></div>
  </div>

  <h2>统一工作台</h2>
  <div class="card">
    <div class="row">
      <select id="wb-shop"><option value="">全部账号</option></select>
      <select id="wb-filter"><option value="active">进行中</option><option value="handoff">待接管</option><option value="all">全部</option></select>
      <button onclick="loadConversations()">刷新会话</button>
      <button onclick="loadSeller()">店主指令</button>
      <span class="muted" id="wb-hint">选择会话后可人工回复或接管；店主指令可让小二上下架/改价/发布。</span>
    </div>
    <div class="workbench" style="margin-top:12px">
      <div class="card" style="padding:0;max-height:560px;overflow:auto">
        <div id="conv-list"><div class="muted" style="padding:12px">加载中…</div></div>
      </div>
      <div class="card">
        <div id="conv-head" class="muted">选择左侧会话查看消息</div>
        <div id="thread" class="thread"><div class="muted">暂无消息</div></div>
        <textarea id="reply-text" rows="3" placeholder="人工回复给买家…" style="margin-top:10px"></textarea>
        <div class="row" style="margin-top:8px">
          <button class="primary" onclick="sendReply()">发送回复</button>
          <button onclick="conversationAction('takeover')">接管</button>
          <button onclick="conversationAction('resume')">恢复 AI</button>
          <span class="err" id="conv-error"></span>
        </div>
      </div>
    </div>
  </div>

  <h2>店主指令 / 上下架</h2>
  <div class="card">
    <div id="seller-head" class="muted">选择具体账号后，可对小二说：把 xxx 下架、把 xxx 改价 199、发布 …</div>
    <div id="seller-thread" class="thread" style="height:220px;margin-top:10px"></div>
    <textarea id="seller-text" rows="3" placeholder="例如：把「白色空军一号」下架；或：把 xxx 改价 199" style="margin-top:10px"></textarea>
    <div class="row" style="margin-top:8px">
      <button class="primary" onclick="sendSeller()">发送给小二</button>
      <span class="err" id="seller-error"></span>
    </div>
    <div id="pending"></div>
  </div>

  <h2>闲鱼账号</h2>
  <table><thead><tr><th>实例</th><th>状态</th><th>登录账号</th><th>端口</th><th>操作</th></tr></thead>
    <tbody id="accounts"></tbody></table>
  <div class="err" id="account-error"></div>

  <h2>添加闲鱼账号</h2>
  <div class="card">
    <div class="row">
      <input id="f-name" placeholder="本地名称，如 主号 / 小号" style="width:240px">
      <button class="primary" onclick="addAccount()">添加并启动</button>
      <span class="muted">添加后点「扫码登录」，用真实闲鱼账号扫码；不需要填端口。</span>
    </div>
    <div class="err" id="add-error"></div>
  </div>

  <h2>汇总</h2>
  <div class="card row">
    <button onclick="loadDaily()">刷新日报</button>
    <button onclick="loadAlerts()">刷新告警</button>
    <span class="muted">只读汇总，不改各账号数据。</span>
  </div>
  <div id="daily" class="card" style="margin-top:12px"></div>
  <h2>告警</h2>
  <div id="alerts" class="card"></div>
</main>

<div id="qr-mask" class="hide">
  <div id="qr-box">
    <h3 style="margin:0 0 8px">扫码登录闲鱼</h3>
    <img id="qr-img" alt="闲鱼登录二维码">
    <div id="qr-status" class="muted" style="margin-top:10px">等待扫码…</div>
    <div class="row" style="justify-content:center;margin-top:10px">
      <button onclick="closeQr()">关闭</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, options = {}) {
  const response = await fetch(path, {headers: {'Content-Type': 'application/json'}, ...options});
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
  return data;
}

function fillShopSelect(accounts) {
  const select = $('wb-shop');
  const current = select.value;
  select.innerHTML = '<option value="">全部账号</option>' +
    accounts.map(a => `<option value="${esc(a.id)}">${esc(a.name)}（${esc(a.id)}）</option>`).join('');
  if (accounts.some(a => a.id === current)) select.value = current;
}

async function loadAccounts() {
  const data = await api('/api/control/accounts');
  $('kpi-accounts').textContent = data.accounts.length;
  $('kpi-online').textContent = data.accounts.filter(a => a.health && a.health.online).length;
  $('kpi-login').textContent = data.accounts.filter(a => a.account && a.account.status === 'online').length;
  $('accounts').innerHTML = data.accounts.map(a => {
    const account = a.account || {};
    const running = a.running;
    const dot = running && a.health && a.health.online ? 'ok' : running ? 'warn' : 'bad';
    return `<tr>
      <td><b>${esc(a.name)}</b><div class="muted">${esc(a.id)}</div></td>
      <td><span class="dot ${dot}"></span>${running ? (a.health && a.health.online ? '运行中' : '启动中') : '已停止'}
        <div class="muted">${a.restarts ? `重启 ${a.restarts} 次` : ''} ${esc(a.last_error || '')}</div></td>
      <td>${account.nickname || account.platform_user_id || '<span class="muted">未登录</span>'}
        <div class="muted">${esc(account.session_state || '')}</div></td>
      <td>${a.port}</td>
      <td class="row">
        <button onclick="loginAccount('${esc(a.id)}')">扫码登录</button>
        <button onclick="accountAction('${esc(a.id)}','start')">启动</button>
        <button onclick="accountAction('${esc(a.id)}','stop')">停止</button>
        <button onclick="accountAction('${esc(a.id)}','restart')">重启</button>
        <button onclick="accountAction('${esc(a.id)}','sync')">同步</button>
      </td></tr>`;
  }).join('') || '<tr><td colspan="5" class="muted">还没有账号</td></tr>';
  fillShopSelect(data.accounts);
}

async function addAccount() {
  $('add-error').textContent = '';
  const name = $('f-name').value.trim();
  if (!name) { $('add-error').textContent = '请填写本地名称'; return; }
  try {
    await api('/api/control/accounts', {method: 'POST', body: JSON.stringify({name})});
    $('f-name').value = '';
    await loadAccounts();
  } catch (err) { $('add-error').textContent = err.message; }
}

async function accountAction(id, action) {
  $('account-error').textContent = '';
  try {
    const data = await api(`/api/control/accounts/${encodeURIComponent(id)}/${action}`, {method: 'POST', body: '{}'});
    if (data && data.ok === false) $('account-error').textContent = data.error || '操作失败';
  } catch (err) { $('account-error').textContent = err.message; }
  await loadAccounts();
}

let qrTimer = null;
async function loginAccount(id) {
  $('account-error').textContent = '';
  try {
    const data = await api(`/api/control/accounts/${encodeURIComponent(id)}/login/start`, {method: 'POST', body: '{}'});
    if (!data.qr_code_url) throw new Error('没有拿到二维码，账号实例可能未启动');
    $('qr-img').src = data.qr_code_url;
    $('qr-status').textContent = '请用闲鱼 App 扫码…';
    $('qr-mask').classList.remove('hide');
    if (qrTimer) clearInterval(qrTimer);
    qrTimer = setInterval(() => pollLogin(id, data.account_id), 2000);
  } catch (err) { $('account-error').textContent = err.message; }
}

async function pollLogin(shopId, accountId) {
  try {
    const data = await api(`/api/control/accounts/${encodeURIComponent(shopId)}/login/status?account_id=${encodeURIComponent(accountId)}`);
    if (data.status === 'success') {
      $('qr-status').textContent = '登录成功，正在同步商品…';
      clearInterval(qrTimer); qrTimer = null;
      await api(`/api/control/accounts/${encodeURIComponent(shopId)}/login/sync?account_id=${encodeURIComponent(accountId)}`, {method: 'POST', body: '{}'});
      $('qr-mask').classList.add('hide');
      await loadAccounts();
    } else {
      $('qr-status').textContent = `状态：${data.status || '等待扫码'}`;
    }
  } catch (_) {}
}

function closeQr() {
  if (qrTimer) clearInterval(qrTimer);
  qrTimer = null;
  $('qr-mask').classList.add('hide');
}

let currentConv = null;
async function loadConversations() {
  const shop = $('wb-shop').value;
  const filter = $('wb-filter').value;
  $('conv-list').innerHTML = '<div class="muted" style="padding:12px">加载中…</div>';
  try {
    const data = await api(`/api/control/workbench/conversations?shop_id=${encodeURIComponent(shop)}&filter=${filter}`);
    $('wb-hint').textContent = data.errors && data.errors.length
      ? `部分账号不可达：${data.errors.map(e => e.shop_id).join(', ')}`
      : '选择会话后可人工回复或接管；店主指令可让小二上下架/改价/发布。';
    $('conv-list').innerHTML = data.conversations.map(c => `
      <div class="conv ${currentConv && currentConv.convId === c.id && currentConv.shopId === c.shop_id ? 'active' : ''}"
           onclick="openConversation('${esc(c.shop_id)}','${esc(c.id)}')">
        <div class="name">${esc(c.buyer_nick || '买家')} <span class="pill">${esc(c.shop_name || c.shop_id)}</span></div>
        <div class="muted">${esc(c.item_title || '未绑定商品')} ${c.handoff ? '<span class="pill">待接管</span>' : ''}</div>
        <div class="last">${esc(c.last_text || '')}</div>
      </div>`).join('') || '<div class="muted" style="padding:12px">没有会话</div>';
  } catch (err) {
    $('conv-list').innerHTML = `<div class="err" style="padding:12px">${esc(err.message)}</div>`;
  }
}

async function openConversation(shopId, conversationId) {
  $('conv-error').textContent = '';
  try {
    const data = await api(`/api/control/workbench/${encodeURIComponent(shopId)}/conversations/${encodeURIComponent(conversationId)}`);
    currentConv = {shopId, convId: conversationId};
    const conv = data.conversation || {};
    $('conv-head').innerHTML = `<b>${esc(data.buyer?.nick || conv.buyer_nick || '买家')}</b>
      <span class="pill">${esc(data.shop_name || shopId)}</span>
      <span class="muted">${esc(data.item?.title || '未绑定商品')}</span>`;
    $('thread').innerHTML = (data.messages || []).map(m => `
      <div class="msg ${m.direction === 'out' ? 'out' : ''}">
        <div class="meta">${esc(m.role || '')} · ${esc(m.created_at || '')}</div>${esc(m.text || '')}
      </div>`).join('') || '<div class="muted">暂无消息</div>';
    $('thread').scrollTop = $('thread').scrollHeight;
    await loadConversations();
  } catch (err) { $('conv-error').textContent = err.message; }
}

async function sendReply() {
  if (!currentConv) { $('conv-error').textContent = '请先选择会话'; return; }
  const text = $('reply-text').value.trim();
  if (!text) { $('conv-error').textContent = '回复不能为空'; return; }
  $('conv-error').textContent = '';
  try {
    await api(`/api/control/workbench/${encodeURIComponent(currentConv.shopId)}/conversations/${encodeURIComponent(currentConv.convId)}/reply`,
      {method: 'POST', body: JSON.stringify({text})});
    $('reply-text').value = '';
    await openConversation(currentConv.shopId, currentConv.convId);
  } catch (err) { $('conv-error').textContent = err.message; }
}

async function conversationAction(action) {
  if (!currentConv) { $('conv-error').textContent = '请先选择会话'; return; }
  try {
    await api(`/api/control/workbench/${encodeURIComponent(currentConv.shopId)}/conversations/${encodeURIComponent(currentConv.convId)}/${action}`,
      {method: 'POST', body: '{}'});
    await openConversation(currentConv.shopId, currentConv.convId);
  } catch (err) { $('conv-error').textContent = err.message; }
}

function renderSeller(data) {
  const messages = data.messages || [];
  $('seller-thread').innerHTML = messages.map(m => `
    <div class="msg ${m.direction === 'out' ? 'out' : ''}">
      <div class="meta">${esc(m.role || '')} · ${esc(m.created_at || '')}</div>${esc(m.text || '')}
    </div>`).join('') || '<div class="muted">暂无店主指令记录</div>';
  const pending = data.pending || [];
  $('pending').innerHTML = pending.map(p => `
    <div class="alert"><b>待确认：${esc(p.title || p.kind || '')}</b>
    <div class="muted">${esc(p.preview || p.summary || '')}</div>
    <button onclick="confirmAction('${esc(p.id)}','confirm')">确认</button>
    <button class="danger" onclick="confirmAction('${esc(p.id)}','cancel')">取消</button></div>`).join('');
}

async function loadSeller() {
  const shop = $('wb-shop').value;
  $('seller-error').textContent = '';
  if (!shop) { $('seller-error').textContent = '请先选择具体账号'; return; }
  try {
    const data = await api(`/api/control/workbench/${encodeURIComponent(shop)}/seller`);
    $('seller-head').innerHTML = `当前账号：<b>${esc(data.shop_name || shop)}</b>`;
    renderSeller(data);
  } catch (err) { $('seller-error').textContent = err.message; }
}

async function sendSeller() {
  const shop = $('wb-shop').value;
  const text = $('seller-text').value.trim();
  if (!shop || !text) { $('seller-error').textContent = '请选择具体账号并输入指令'; return; }
  $('seller-error').textContent = '';
  try {
    await api(`/api/control/workbench/${encodeURIComponent(shop)}/seller`,
      {method: 'POST', body: JSON.stringify({text})});
    $('seller-text').value = '';
    await loadSeller();
  } catch (err) { $('seller-error').textContent = err.message; }
}

async function confirmAction(id, action) {
  const shop = $('wb-shop').value;
  if (!shop) return;
  try {
    await api(`/api/control/workbench/${encodeURIComponent(shop)}/confirmations/${encodeURIComponent(id)}/${action}`,
      {method: 'POST', body: '{}'});
    await loadSeller();
  } catch (err) { $('seller-error').textContent = err.message; }
}

async function loadAlerts() {
  try {
    const data = await api('/api/control/alerts');
    $('kpi-alerts').textContent = data.alerts.length;
    $('alerts').innerHTML = data.alerts.map(a => `
      <div class="alert"><span class="pill">${esc(a.shop_name || a.shop_id)}</span>
      <b>${esc(a.level || '')}</b> ${esc(a.title || '')}
      <div class="muted">${esc(a.message || a.detail || '')}</div></div>`).join('') || '<div class="muted">没有未处理告警</div>';
  } catch (err) { $('alerts').innerHTML = `<div class="err">${esc(err.message)}</div>`; }
}

async function loadDaily() {
  $('daily').innerHTML = '<div class="muted">加载中…</div>';
  try {
    const data = await api('/api/control/daily');
    $('daily').innerHTML = data.shops.map(s => `
      <div class="alert"><b>${esc(s.shop_name)}</b> <span class="muted">${esc(s.shop_id)}</span>
      <pre style="white-space:pre-wrap;margin:6px 0 0">${esc(JSON.stringify(s.today || {}, null, 2))}</pre>
      ${s.error ? `<div class="err">${esc(s.error)}</div>` : ''}</div>`).join('') || '<div class="muted">没有账号</div>';
  } catch (err) { $('daily').innerHTML = `<div class="err">${esc(err.message)}</div>`; }
}

(async () => {
  await loadAccounts(); await loadConversations(); await loadAlerts();
  setInterval(loadAccounts, 15000);
})();
</script>
</body>
</html>
